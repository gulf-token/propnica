version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Display Node.js and npm versions for debugging
            - node --version
            - npm --version
            # Install dependencies with clean install
            - npm ci
            # Generate Prisma client
            - npx prisma generate
            # Run type checking to catch errors early
            - npm run type-check || echo "Type check had warnings, continuing..."
        build:
          commands:
            # Build Next.js application
            - npm run build
        postBuild:
          commands:
            # Display build size summary
            - du -sh .next/
            - echo "Build completed successfully"
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
          - .npm/**/*
      buildSizeConfig:
        # Fail the build if bundle size exceeds limits
        maxSize: '50MB'
    appRoot: .
